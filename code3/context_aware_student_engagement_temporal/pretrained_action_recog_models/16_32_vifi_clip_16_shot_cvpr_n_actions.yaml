DATA:
    ROOT: '.'
    TRAIN_FILE: 'annotations/train.txt'
    VAL_FILE: 'annotations/val.txt'
    DATASET: studentActions
    NUM_FRAMES: 16
    NUM_CLASSES: 15
    LABEL_LIST: 'action_labels.csv'
    NUM_WORKERS: 0
    VAL_BATCH_SIZE: 1
MODEL:
    ARCH: ViT-B/16 #ViT-B/16
TRAIN:
    BATCH_SIZE: 2 # Limited by the available training data and GPU memory.
    ACCUMULATION_STEPS: 4 #2
    EPOCHS: 30
    LR: 2.e-06
TRAINER:
  ViFi_CLIP:
    ZS_EVAL: False # Make True only during test mode to evaluate zero-shot vanilla CLIP performance
    USE: "both" # both refers to complete fine-tuning of CLIP (text+image encoders)
SAVE_FREQ: 10